name: AirTranslate13Mini
options:
  bundleIdPrefix: net.vyres
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  AirTranslate13Mini:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AirTranslate
    dependencies:
      - target: VYRMobile
    info:
      path: AirTranslate/Info.plist
      properties:
        CFBundleDisplayName: iVYRE
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "4"
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "iVYRE uses the microphone to hear Spanish speech and translate it into English."
        NSSpeechRecognitionUsageDescription: "iVYRE uses speech recognition to transcribe Spanish speech for live English translation."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.vyres.AirTranslate13Mini
        PRODUCT_NAME: AirTranslate
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - AirTranslate13MiniTests

  VYRMobile:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: VYRMobile/SafariWebExtensionHandler.swift
      - path: VYRMobile/Resources
        buildPhase: resources
    info:
      path: VYRMobile/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.vyres.AirTranslate13Mini.VYRMobile
        PRODUCT_NAME: VYRMobile
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

  AirTranslate13MiniTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AirTranslateTests
    dependencies:
      - target: AirTranslate13Mini
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.vyres.AirTranslate13MiniTests
