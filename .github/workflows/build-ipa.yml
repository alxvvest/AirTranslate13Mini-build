name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d AirTranslate13Mini.xcodeproj

      - name: Build unsigned app with VYR Mobile
        run: |
          set -euo pipefail
          mkdir -p "$PWD/build"
          xcodebuild \
            -project AirTranslate13Mini.xcodeproj \
            -scheme AirTranslate13Mini \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build 2>&1 | tee "$PWD/build/xcodebuild.log"

      - name: Verify VYR Mobile embedded
        run: |
          set -euo pipefail
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/AirTranslate.app"
          EXT="$APP/PlugIns/VYRMobile.appex"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/AirTranslate"
          test -d "$EXT"
          test -f "$EXT/Info.plist"
          test -f "$EXT/manifest.json"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist" | grep -Fx 'com.apple.Safari.web-extension'
          node --check "$EXT/popup.js"
          echo "VYR_MOBILE_EMBED_PASS"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/AirTranslate.app"
          rm -rf "$PWD/build/Payload"
          mkdir -p "$PWD/build/Payload"
          cp -R "$APP" "$PWD/build/Payload/"
          cd "$PWD/build"
          /usr/bin/zip -qry AirTranslate13Mini-unsigned.ipa Payload
          shasum -a 256 AirTranslate13Mini-unsigned.ipa > AirTranslate13Mini-unsigned.ipa.sha256
          ls -lh AirTranslate13Mini-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iVYRE-VYR-Mobile-unsigned-ipa
          path: |
            build/AirTranslate13Mini-unsigned.ipa
            build/AirTranslate13Mini-unsigned.ipa.sha256
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iVYRE-VYR-Mobile-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
